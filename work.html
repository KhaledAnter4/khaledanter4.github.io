<!DOCTYPE html>
<html lang="en" data-page="work">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects — Khaled Anter</title>
  <meta http-equiv="refresh" content="0; url=projects.html" />
  <meta name="theme-color" content="#080c14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('site-theme');
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var doc = document.documentElement;
        doc.setAttribute('data-theme', theme);
        var bg = theme === 'dark' ? '#080c14' : '#f8fafc';
        doc.style.backgroundColor = bg;
        doc.style.colorScheme = theme;
      } catch (e) {}
      window.location.replace('projects.html');
    })();
  </script>
  <link rel="canonical" href="https://khaledanter4.github.io/projects.html" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="work">
  <main id="main">
    <div class="container" style="padding: 4rem 0; text-align: center;">
      <p>Redirecting to <a href="projects.html" style="color: var(--accent-primary);">Projects</a>...</p>
    </div>
  </main>
</body>
</html>
